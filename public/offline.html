<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tabi — offline</title>
    <style>
      :root { color-scheme: dark light; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      @media (prefers-color-scheme: light) {
        body { background: #f2f2f7; color: #000; }
        p { color: rgb(60 60 67 / 0.62); }
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: rgb(235 235 245 / 0.6); font-size: 15px; margin: 0 0 20px; max-width: 32ch; }
      button {
        background: #e8492a;
        color: #fff;
        border: 0;
        border-radius: 12px;
        padding: 12px 22px;
        font-size: 15px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>No signal</h1>
      <p>This page wasn't saved for offline yet. Open Tabi once with a connection and every tab is kept on your phone.</p>
      <button onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
